<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sandeep Kumar Chaurasiya — Resume</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            padding: 40px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        .loader {
            width: 40px;
            height: 40px;
            margin: 25px auto;
            border: 4px solid #333;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Resume</h1>
    <p>Your resume download is starting...</p>

    <div class="loader"></div>

    <p>You will be redirected to the portfolio shortly.</p>
</div>

<script>

    // Resume PDF
    const resumeURL =
        "./sandeep%20resume.pdf";

    // Portfolio
    const portfolioURL =
        "https://san78141.github.io/SandeepKumarChaurasiya3D-Portfolio/";

    // Start PDF download
    const downloadLink = document.createElement("a");

    downloadLink.href = resumeURL;
    downloadLink.download = "Sandeep_Kumar_Chaurasiya_Resume.pdf";

    document.body.appendChild(downloadLink);

    // Trigger download
    downloadLink.click();

    // Redirect after download starts
    setTimeout(() => {
        window.location.href = portfolioURL;
    }, 2500);

</script>

</body>
</html>
